<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kassakone / Cash Register</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Kassakone</h1>
    <div class="register-card">
      <div class="price-screen">
        <p>Tuotteen hinta: <span id="item-price">$19.5</span></p>
      </div>
      
      <div class="input-section">
        <label for="cash">Syötä käteinen:</label>
        <input type="number" id="cash" placeholder="0.00" />
        <button id="purchase-btn">Osta</button>
      </div>

      <div class="change-section">
        <h3>Vaihtorahat:</h3>
        <p id="change-due">Status:</p>
      </div>
    </div>
  </main>

    <script src="script.js"></script>
</body>
</html>
